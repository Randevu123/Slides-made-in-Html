<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>없는 쪽 — 문혁재</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--
  404 는 어떤 깊이의 주소에서도 뜬다. 그래서 바깥 CSS 를 부르지 않고
  필요한 것만 여기 넣었다 — 상대경로도 절대경로도 안전하지 않기 때문이다.
-->
<style>
  :root{
    --bg:#101114; --text:#f2f3f5; --soft:#a8adb6; --faint:#8b909a; --line:#2a2d33;
    --on:#101114;
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#ffffff; --text:#121314; --soft:#5b5f66; --faint:#6a6e75; --line:#e4e7ee; --on:#ffffff; }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
                "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:17px;line-height:1.72;word-break:keep-all;-webkit-font-smoothing:antialiased;
  }
  main{max-width:720px;margin:0 auto;padding:120px 24px}
  .eyebrow{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
           font-size:13px;letter-spacing:.06em;color:var(--faint)}
  h1{font-size:clamp(28px,4vw,42px);font-weight:600;letter-spacing:-.02em;line-height:1.18;margin:14px 0 16px}
  p.lead{font-size:19px;color:var(--soft)}
  .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}
  a.btn{
    display:inline-block;font-size:15px;font-weight:500;padding:11px 20px;border-radius:999px;
    border:1px solid var(--line);color:var(--soft);text-decoration:none;
    transition:background .2s cubic-bezier(.4,0,.2,1),color .2s cubic-bezier(.4,0,.2,1);
  }
  a.btn:hover{color:var(--text);background:rgba(128,128,128,.08)}
  a.btn-1{background:var(--text);color:var(--on);border-color:var(--text);font-weight:600}
  .note{font-size:14px;color:var(--faint);margin-top:28px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">404</p>
  <h1>이 주소에는 아무것도 없습니다.</h1>
  <p class="lead">주소가 바뀌었거나, 아직 안 쓴 글일 수 있습니다.</p>
  <div class="cta">
    <a class="btn btn-1" href="/" data-to="">홈으로</a>
    <a class="btn" href="/projects/" data-to="projects/">프로젝트</a>
    <a class="btn" href="/blog/" data-to="blog/">글</a>
  </div>
  <p class="note">잘못된 주소가 계속 보이면 알려 주세요 — jejuharry123@gmail.com</p>
</main>
<script>
/* GitHub Pages 프로젝트 사이트는 /저장소이름/ 아래에 놓인다.
   그때는 "/" 로 시작하는 링크가 계정 루트로 나가 버리므로 앞에 저장소 이름을 붙인다. */
(function () {
  var base = '/';
  if (/\.github\.io$/i.test(location.hostname)) {
    var first = location.pathname.split('/')[1];
    if (first) base = '/' + first + '/';
  }
  var links = document.querySelectorAll('a[data-to]');
  for (var i = 0; i < links.length; i++) {
    links[i].setAttribute('href', base + links[i].getAttribute('data-to'));
  }
})();
</script>
</body>
</html>
